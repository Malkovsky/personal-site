format:
  html:
    theme: 
      light: [cosmo, ../styles/custom.scss]
      dark: [darkly, ../styles/custom.scss]
    include-before-body: ../styles/theme-persistence.html
    toc: true
    toc-depth: 3
    link-external-newwindow: true
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    smooth-scroll: true
    lang: ru
    
# Execution options for Jupyter notebooks
execute:
  freeze: auto
  cache: true
