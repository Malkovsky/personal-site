<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Language / Выберите язык</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #173f4f 0%, #216a82 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: #faf9f6;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(10, 28, 35, 0.35);
            padding: 60px;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #173f4f;
            margin-bottom: 40px;
            font-size: 2.5em;
            font-weight: 700;
        }
        
        .language-selector {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .language-option {
            flex: 1;
            min-width: 200px;
            padding: 30px;
            border: 3px solid #d8d5cd;
            border-radius: 15px;
            text-decoration: none;
            color: #263238;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .language-option:hover {
            border-color: #d49a3a;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(23, 63, 79, 0.2);
        }
        
        .flag {
            font-size: 4em;
            margin-bottom: 15px;
            display: block;
        }
        
        .language-name {
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 10px;
            display: block;
        }
        
        .language-label {
            font-size: 1em;
            color: #58666c;
            display: block;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 40px 30px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .language-selector {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome / Добро пожаловать</h1>
        <div class="language-selector">
            <a href="en/index.html" class="language-option">
                <span class="flag">🇬🇧</span>
                <span class="language-name">English</span>
                <span class="language-label">Continue in English</span>
            </a>
            <a href="ru/index.html" class="language-option">
                <span class="flag">🇷🇺</span>
                <span class="language-name">Русский</span>
                <span class="language-label">Продолжить на русском</span>
            </a>
        </div>
    </div>
    
    <script>
        // Auto-detect browser language and redirect if it matches
        const userLang = navigator.language || navigator.userLanguage;
        const autoRedirect = false; // Set to true to enable auto-redirect
        
        if (autoRedirect) {
            if (userLang.startsWith('ru')) {
                window.location.href = 'ru/index.html';
            } else {
                window.location.href = 'en/index.html';
            }
        }
    </script>
</body>
</html>
